# Topic hubs.
#
# The archive is 500+ episodes whose only index is one giant chronological
# list, so nothing on the site groups episodes by the thing a listener is
# actually dealing with. These entries drive /topics/ and the pages under it.
#
# `keywords` are matched, case-insensitively, as substrings of the episode
# title. Keep them as word stems ("promot" catches promote/promoted/promotion)
# and keep them specific enough not to drag in unrelated episodes -- a hub full
# of loosely-related episodes is worse than a smaller, accurate one.

- slug: getting-promoted
  title: Getting Promoted
  heading: Getting Promoted as a Software Engineer
  description: "Podcast episodes on getting promoted as a software engineer: promotion criteria, making your case, senior and staff levels, and what to do when a promotion stalls."
  intro: >-
    Promotions are the questions we get asked about most. These episodes cover
    how promotion decisions actually get made, how to build a case your manager
    can take upstairs, what changes between the junior, senior and staff levels,
    and what to do when you have done the work but the title has not followed.
  keywords:
    - promot
    - demot
    - career ladder
    - job title
    - title
    - senior
    - staff engineer
    - principal engineer
    - level up
    - career growth
    - climbing

- slug: salary-and-raises
  title: Salary and Raises
  heading: Salary, Raises and Negotiation for Developers
  description: "Podcast episodes on software engineer pay: asking for a raise, negotiating an offer, equity, bonuses, and finding out you are underpaid compared to your team."
